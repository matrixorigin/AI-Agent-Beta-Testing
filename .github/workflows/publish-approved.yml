name: Publish approved MatrixFlow draft

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: read

concurrency:
  group: publish-case-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.label.name == 'publish/approved'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out automation repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Publish approved draft
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TARGET_REPOSITORY: matrixorigin/matrixflow
          STORYBOOK_PROJECT: New MatrixOne Intelligence
        with:
          github-token: ${{ secrets.MATRIXFLOW_AUTOMATION_TOKEN }}
          retries: 2
          script: |
            const publish = require('./.github/scripts/publish-draft.cjs');
            await publish({ github, context, core });
